# Body text for SlimeTinker's wiki topics, keyed by the topic id declared in topics.yml.
# Rendered as paginated tooltip text; keep lines short (~45 chars).

slimetinker_tools:
  - '&e&lTinker''s Tools'
  - '&7A Tinker''s tool is built from three'
  - '&7parts: a head, a binder and a rod.'
  - ''
  - '&7Each part is cast from a metal, and'
  - '&7the metal you pick decides the tool''s'
  - '&7speed, durability and traits.'
  - ''
  - '&e&lLevelling'
  - '&7Tools start as &7Stone&7. As they gain'
  - '&7EXP they promote through:'
  - '&7  &eGold > Iron > Diamond > Netherite'
  - ''
  - '&7Every promotion unlocks another'
  - '&7modifier slot, so an old tool is worth'
  - '&7more than a freshly built one.'
  - ''
  - '&7Build tools at the &eTool Table&7, and'
  - '&7repair them at the &eRepair Bench'
  - '&7with a Repair Kit of the same metal.'

slimetinker_armour:
  - '&e&lTinker''s Armour'
  - '&7Armour is assembled from cast plates'
  - '&7and a gambeson at the &eArmour Table&7.'
  - ''
  - '&e&lLevelling'
  - '&7Armour starts as &7Leather &7and promotes'
  - '&7through:'
  - '&7  &eChain > Iron > Diamond > Netherite'
  - ''
  - '&7As with tools, each promotion opens'
  - '&7another modifier slot, and the metals'
  - '&7you cast the plates from carry their'
  - '&7own traits onto the finished piece.'

slimetinker_parts:
  - '&e&lParts & Building'
  - '&7Everything starts at the &eSmeltery&7:'
  - '&7melt ore or ingots into molten metal.'
  - ''
  - '&7Pour the molten metal into a &eCast'
  - '&7to form a part. A cast is reusable, so'
  - '&7one cast makes any number of parts.'
  - ''
  - '&7Alloys are made by melting two metals'
  - '&7together, and generally give better'
  - '&7traits than either metal alone.'
  - ''
  - '&7Once you have a head, a binder and a'
  - '&7rod, combine them at the Tool Table.'

slimetinker_modifiers:
  - '&e&lModifiers & Traits'
  - '&7&lTraits &7come from the metal a part is'
  - '&7cast from. They are fixed the moment'
  - '&7the part is made, so choose the metal'
  - '&7for the job.'
  - ''
  - '&7&lModifiers &7are added afterwards at the'
  - '&7Modification Table, and each one takes'
  - '&7up a slot unlocked by levelling.'
  - ''
  - '&7Examples: &eRedstone &7grants Haste,'
  - '&7and other modifiers add effects while'
  - '&7the gear is held or worn.'
  - ''
  - '&7Check the &ePart Dictionary &7to compare'
  - '&7what each metal offers before casting.'
